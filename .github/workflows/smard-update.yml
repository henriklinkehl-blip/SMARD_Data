name: SMARD-Daten aktualisieren

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Gesamten Zeitraum ab 2022 neu laden"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub verwendet UTC. 18:17 UTC entspricht 19:17 MEZ bzw. 20:17 MESZ.
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: smard-daten-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SMARD-Daten herunterladen und zusammenführen
        env:
          FULL_REFRESH: ${{ github.event.inputs.full_refresh || 'false' }}
          SMARD_START_DATE: "2022-01-01"
          SMARD_LOOKBACK_DAYS: "7"
        run: python Scripts/update_smard.py

      - name: Änderungen im Repository speichern
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data download
          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "SMARD-Daten automatisch aktualisiert"
            git push
          fi

      - name: ZIP zusätzlich als Workflow-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SMARD-Daten-aktuell
          path: download/SMARD_Daten_aktuell.zip
          retention-days: 30
          if-no-files-found: error
