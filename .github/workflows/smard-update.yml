name: SMARD-Daten und Istwerte aktualisieren

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Alle SMARD-Reihen ab 01.01.2022 vollständig neu einlesen"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub verwendet UTC. 18:17 UTC entspricht 19:17 MEZ bzw. 20:17 MESZ.
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: smard-daten-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: SMARD-Prognosen, Istwerte und Prognosefehler aktualisieren
        env:
          FULL_REFRESH: ${{ github.event.inputs.full_refresh || 'false' }}
          SMARD_START_DATE: "2022-01-01"
          SMARD_LOOKBACK_DAYS: "7"
        run: python Scripts/update_smard.py

      - name: Änderungen im Repository speichern
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Data
          if git diff --cached --quiet; then
            echo "Keine Änderungen in Data vorhanden."
          else
            git commit -m "SMARD-Daten und Istwerte automatisch aktualisiert"
            git push
          fi

      - name: Aktuelles Datenpaket bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: SMARD-Daten-aktuell
          path: |
            download/SMARD_Daten_aktuell.zip
            download/Letzte_Aktualisierung.txt
            download/QUELLE_UND_HINWEISE.txt
          retention-days: 30
          if-no-files-found: error
